[project]
name = "vocab-coach"
version = "0.2.0"
description = "A local-first FSRS vocabulary coach"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "fsrs>=6.3,<7",
  "jinja2>=3.1,<4",
  "openai>=1.93,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
agent = [
  "mcp>=1.12,<2",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
vocab-coach = "vocab_coach.cli:main"
vocab-coach-mcp = "vocab_coach.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["vocab_coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
